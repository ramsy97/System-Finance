version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: sistem-keuangan-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sistem_keuangan
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Docker/postgres.conf:/etc/postgresql/postgresql.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Docker/backend.Dockerfile
    container_name: sistem-keuangan-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/sistem_keuangan?schema=public"
      JWT_SECRET: "super-secret-jwt-key-change-in-production-2024"
      JWT_EXPIRES_IN: "24h"
      PORT: 4000
      FRONTEND_URL: "http://localhost:3000"
      UPLOAD_DIR: "./uploads"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups

  frontend:
    build:
      context: .
      dockerfile: Docker/frontend.Dockerfile
    container_name: sistem-keuangan-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:4000/api"
      NODE_ENV: production
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_uploads:
  backend_backups:
