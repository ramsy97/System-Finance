# PostgreSQL configuration file
# Connection settings
listen_addresses = '*'
port = 5432
max_connections = 100

# Memory settings
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 64MB

# Write-ahead log
wal_level = minimal
max_wal_size = 1GB
min_wal_size = 80MB

# Query tuning
effective_cache_size = 512MB
random_page_cost = 1.1

# Logging
log_statement = 'none'
log_duration = off
log_line_prefix = '%m [%p] '
